<svg xmlns="http://www.w3.org/2000/svg" width="965" height="495" viewBox="0 0 965 495" role="img" aria-labelledby="title desc"><title id="title">左侧为固定调度下的一条抽象路径，右侧为同时依赖所有调度失败结论的证明 DAG 概念图。</title><desc id="desc">左侧为固定调度下的一条抽象路径，右侧为同时依赖所有调度失败结论的证明 DAG 概念图。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#1e293b}.title{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#475569}.label{font-size:18px;font-weight:700;fill:#0f766e}.formula{font-family:'DejaVu Sans',sans-serif;font-size:22px}</style><rect width="965" height="495" rx="16" fill="#f8fafc"/><text x="30" y="43" class="title" text-anchor="start">路径与 DAG：需要保留哪些失败理由？</text><rect x="25" y="80" width="295" height="390" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="115" class="label" text-anchor="start">固定调度后的路径</text><rect x="70" y="145" width="200" height="58" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="170" y="181" class="body" text-anchor="middle">抽象状态 A₀</text><path d="M 170 203 L 170 240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="245" width="200" height="58" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="170" y="281" class="body" text-anchor="middle">抽象状态 A₁</text><path d="M 170 303 L 170 340" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="345" width="200" height="58" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="170" y="381" class="body" text-anchor="middle">坏状态</text><text x="48" y="450" class="small" text-anchor="start">沿已选定的调度向前执行</text><rect x="340" y="80" width="600" height="390" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="365" y="115" class="label" text-anchor="start">doomed 反驳中的局部合取依赖</text><rect x="530" y="140" width="225" height="50" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="642" y="173" class="body" text-anchor="middle">可共享的证明前提</text><path d="M 642 190 L 445 245" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="250" width="165" height="65" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="447" y="277" class="body" text-anchor="middle">D{1}(X′)</text><text x="447" y="302" class="small" text-anchor="middle">此调度也失败</text><path d="M 447 315 L 642 362" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 642 190 L 630 245" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="550" y="250" width="165" height="65" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="632" y="277" class="body" text-anchor="middle">D{2}(X′)</text><text x="632" y="302" class="small" text-anchor="middle">此调度也失败</text><path d="M 632 315 L 642 362" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 642 190 L 815 245" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="735" y="250" width="165" height="65" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="817" y="277" class="body" text-anchor="middle">D{1,2}(X′)</text><text x="817" y="302" class="small" text-anchor="middle">此调度也失败</text><path d="M 817 315 L 642 362" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="365" width="325" height="55" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="642" y="400" class="body" text-anchor="middle">合取后向前驱传播 doomed</text><text x="365" y="450" class="small" text-anchor="start">箭头表示证明依赖；不是三选一的执行分支。</text></svg>