<svg xmlns="http://www.w3.org/2000/svg" width="965" height="525" viewBox="0 0 965 525" role="img" aria-labelledby="title desc"><title id="title">doubleSquare 的对齐关系：A 到 B 只推进 v1，B 回 A 同时推进两份副本，退出后 v2 翻倍。</title><desc id="desc">doubleSquare 的对齐关系：A 到 B 只推进 v1，B 回 A 同时推进两份副本，退出后 v2 翻倍。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#1e293b}.title{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#475569}.label{font-size:18px;font-weight:700;fill:#0f766e}.formula{font-family:'DejaVu Sans',sans-serif;font-size:22px}</style><rect width="965" height="525" rx="16" fill="#f8fafc"/><text x="32" y="45" class="title" text-anchor="start">doubleSquare：两轮对一轮</text><text x="32" y="78" class="small" text-anchor="start">共同输入 x₁ = x₂；图中一步表示一轮循环体。</text><rect x="35" y="150" width="320" height="150" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="58" y="184" class="label" text-anchor="start">检查点 A</text><text x="58" y="226" class="formula" text-anchor="start">z₁ = 2z₂</text><text x="58" y="266" class="formula" text-anchor="start">y₁ = 2y₂</text><rect x="610" y="150" width="320" height="150" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="633" y="184" class="label" text-anchor="start">中间状态 B</text><text x="633" y="226" class="formula" text-anchor="start">z₁ = 2z₂ − 1</text><text x="633" y="266" class="formula" text-anchor="start">y₁ = 2y₂ + x₂</text><path d="M 355 194 L 605 194" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="157" class="body" text-anchor="middle">只执行 v1</text><text x="482" y="181" class="small" text-anchor="middle">{1}</text><path d="M 610 268 L 360 268" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="309" class="body" text-anchor="middle">v1、v2 各一轮</text><text x="482" y="335" class="small" text-anchor="middle">{1, 2}</text><text x="35" y="121" class="label" text-anchor="start">循环分支：在 A 且 z₂ > 0 时，重复以下两步</text><path d="M 195 300 L 195 400" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="215" y="365" class="small" text-anchor="start">在 A 且 z₂ = 0</text><rect x="35" y="405" width="895" height="90" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="58" y="442" class="body" text-anchor="start">两边退出循环；只执行 v2 的最终翻倍</text><text x="58" y="476" class="formula" text-anchor="start">y₂ ← 2y₂，得到 y₁ = y₂</text></svg>