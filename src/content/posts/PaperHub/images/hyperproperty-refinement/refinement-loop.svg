<svg xmlns="http://www.w3.org/2000/svg" width="965" height="640" viewBox="0 0 965 640" role="img" aria-labelledby="title desc"><title id="title">AbsHyHorn 精化流程：抽象 CHC 的 SAT 证明性质，UNSAT 产生 DAG；精化 CHC 的 UNSAT 反驳性质，SAT 提供新谓词。</title><desc id="desc">AbsHyHorn 精化流程：抽象 CHC 的 SAT 证明性质，UNSAT 产生 DAG；精化 CHC 的 UNSAT 反驳性质，SAT 提供新谓词。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#1e293b}.title{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#475569}.label{font-size:18px;font-weight:700;fill:#0f766e}.formula{font-family:'DejaVu Sans',sans-serif;font-size:22px}</style><rect width="965" height="640" rx="16" fill="#f8fafc"/><text x="30" y="43" class="title" text-anchor="start">AbsHyHorn：由反驳结构驱动精化</text><rect x="295" y="75" width="365" height="65" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="477" y="116" class="body" text-anchor="middle">当前谓词集 P（初始为空）</text><path d="M 477 140 L 477 176" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="295" y="180" width="365" height="65" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="477" y="221" class="body" text-anchor="middle">求解抽象 CHC：Πₚ</text><path d="M 660 212 L 735 212" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="696" y="198" class="small" text-anchor="middle">SAT</text><rect x="740" y="182" width="195" height="60" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="837" y="219" class="body" text-anchor="middle">性质成立</text><path d="M 477 245 L 477 287" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="490" y="274" class="small" text-anchor="start">UNSAT</text><rect x="295" y="292" width="365" height="75" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="477" y="323" class="body" text-anchor="middle">获得反驳 DAG：G</text><text x="477" y="350" class="small" text-anchor="middle">按 G 构造非递归精化 CHC：Πᵣ</text><path d="M 477 367 L 477 406" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="295" y="411" width="365" height="65" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="477" y="452" class="body" text-anchor="middle">在具体语义下求解 Πᵣ</text><path d="M 660 444 L 735 444" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="698" y="430" class="small" text-anchor="middle">UNSAT</text><rect x="740" y="414" width="195" height="60" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="837" y="451" class="body" text-anchor="middle">性质不成立</text><path d="M 477 476 L 477 518" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="490" y="506" class="small" text-anchor="start">SAT：反驳虚假</text><rect x="250" y="523" width="455" height="90" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="477" y="558" class="body" text-anchor="middle">收集节点解释中的原子公式</text><text x="477" y="590" class="small" text-anchor="middle">可选：关系泛化与筛选，然后加入 P</text><path d="M 250 568 L 125 568 L 125 108 L 290 108" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="339" class="small" text-anchor="start">更新谓词</text></svg>